name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://image.pollinations.ai/prompt/rainy%20window%20at%20night?width=1080&height=1920&nologo=true" \
                   "https://image.pollinations.ai/prompt/rainy%20window%20at%20night?width=1080&height=1920&nologo=true&model=flux" \
                   "https://image.pollinations.ai/prompt/rainy%20window%20at%20night" \
                   "https://gen.pollinations.ai/image/rainy%20window%20at%20night?width=1080&height=1920"; do
            echo "== $u"; curl -s -m 120 -o out.bin -w "%{http_code} %{content_type} %{size_download}\n" "$u"; head -c 300 out.bin | strings | head -5; echo
          done
