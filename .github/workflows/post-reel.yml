name: Post reel

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only render the reel, don't post it"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: post-reel

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Python packages
        timeout-minutes: 6
        # imageio-ffmpeg ships a ready-made ffmpeg, so no slow apt-get is needed.
        run: pip install -q pillow imageio-ffmpeg numpy
      - name: Render and post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          REQUIRE_IMAGE: "1"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          python post.py
      - name: Keep the rendered reel as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: reels/*.mp4
          if-no-files-found: ignore
