name: Post reel

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only render the reel, don't post it"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: post-reel

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and text shaping
        timeout-minutes: 6
        run: |
          # Skip the slow package index refresh when ffmpeg is already on the runner.
          if ! command -v ffmpeg >/dev/null || ! ldconfig -p | grep -q libraqm; then
            sudo apt-get update -q -o Acquire::Retries=3
            sudo apt-get install -y -q --no-install-recommends ffmpeg libraqm0
          fi
          pip install -q pillow
          python -c "from PIL import features; assert features.check('raqm'), 'Telugu shaping missing'"
      - name: Render and post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          REQUIRE_IMAGE: "1"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          python post.py
      - name: Keep the rendered reel as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: reels/*.mp4
          if-no-files-found: ignore
